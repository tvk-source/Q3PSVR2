// Quake III PSVR2 - FW 7.51 tested feature baseline
// Keep games/assets supplied by the player separate from this project.
// Known-good stereo and QVM reticle
seta ps5vr_eyeScale "1.0"
seta ps5vr_crosshair "0"
seta ps5vr_crosshairTrace "0"
seta cg_drawCrosshair "0"
seta ps5vr_vmReticle "1"
seta ps5vr_vmReticleAngle "2.5"
seta ps5vr_vmReticleRange "4096"
seta ps5vr_vmReticleOffset "2.0"
seta ps5vr_vmReticleDepthHack "0"
// Laser sight from gameplay aim, only after QVM laser patch built and tested
seta ps5vr_laserSight "0"
// Gun: off in safe/performance default due user-confirmed combat FPS impact
seta cg_drawGun "0"
seta ps5vr_vmGunMode "1"
seta ps5vr_pcvrGun "1"
seta ps5vr_pcvrAimFollow "0"
seta ps5vr_vmGunScale "0.90"
seta ps5vr_pcvrHandForward "22"
seta ps5vr_pcvrHandRight "12"
seta ps5vr_pcvrHandDown "12"
seta ps5vr_vmGunForward "0"
seta ps5vr_vmGunRight "0"
seta ps5vr_vmGunDown "0"
// Compact status UI previously reported working
seta ps5vr_pcvrHud "1"
seta ps5vr_pcvrHudScale "0.75"
seta ps5vr_pcvrHudY "423"
seta cg_draw3dIcons "0"
seta cg_drawIcons "1"
seta cg_drawStatus "1"
// Optional debug (not for production FPS baseline)
seta cg_drawFPS "0"
seta com_speeds "0"
seta r_speeds "0"
