// Q3PSVR2 sample autoexec.cfg (copy to PPSA99431/baseq3/autoexec.cfg)
// Tested target: PS5 firmware 7.51. Edit values to your comfort.
// This sample is NOT copied automatically to the console or packaged binaries.

// Aim and crosshair: use only the current gameplay-aware QVM reticle
seta ps5vr_crosshair "0"
seta ps5vr_crosshairTrace "0"
seta cg_drawCrosshair "0"
seta ps5vr_vmReticle "1"
seta ps5vr_vmReticleAngle "2.5"
seta ps5vr_vmReticleRange "4096"
seta ps5vr_vmReticleOffset "2.0"
seta ps5vr_vmReticleDepthHack "0"

// Stereo and menu panel
seta ps5vr_eyeScale "1.0"
seta ps5vr_uiPanel "1"
seta ps5vr_uiScale "0.45"

// Default presentation: weapon visible, laser off
seta cg_drawGun "1"
seta ps5vr_vmGunMode "1"
seta ps5vr_pcvrGun "1"
seta ps5vr_laserSight "0"

// PCVR-inspired visual weapon tuning (synthetic hand, NOT Sense pose)
seta ps5vr_vmGunScale "0.70"
seta ps5vr_vmGunForward "0"
seta ps5vr_vmGunRight "0"
seta ps5vr_vmGunDown "0"
seta ps5vr_pcvrHandForward "18"
seta ps5vr_pcvrHandRight "7"
seta ps5vr_pcvrHandDown "8"
seta ps5vr_pcvrAimFollow "1"

// Compact HUD; use flat icons to avoid one-eye issues
seta ps5vr_pcvrHud "1"
seta ps5vr_pcvrHudScale "0.75"
seta ps5vr_pcvrHudY "423"
seta cg_draw3dIcons "0"
seta cg_drawIcons "1"
seta cg_drawStatus "1"

// Release diagnostics off. Use cg_drawFPS 1 temporarily when testing.
seta cg_drawFPS "0"
seta com_speeds "0"
seta r_speeds "0"
